# Certificate profile template shipped with the CA plugin. After uploading the plugin and
# creating a connector, it appears in TLM's "create profile" list (like the built-in
# Sectigo / GlobalSign templates), bound to that connector.
template:
  id: example-ca-tls-server
  name: Example CA TLS Server Certificate
  description: Server certificate issued by Example CA.
  connector_type: Example CA        # must equal metadata.name in the connector configuration
  certificate_type: tls_server

# Fields the admin fills in when creating a profile. "source" values are filled
# dynamically by calling the plugin; their selections reach issueCertificate() in
# IssueCertificateRequest.issuerId / caProfileId / profileSettings.
ca_settings:
  issuer:
    label: Issuing CA
    type: select
    required: true
    source: listIssuers
    maps_to: issuerId
  ca_profile:
    label: Example CA profile
    type: select
    required: true
    source: listCaProfiles
    depends_on: issuer
    maps_to: caProfileId
    help: Most certificate options are defined by the selected CA profile.
  organization:
    label: Organization
    type: text
    required: false
    maps_to: profileSettings.organization

# Certificate options TLM enforces before sending the request to the plugin.
# If the selected CA profile is stricter, the CA profile wins.
certificate_options:
  key_algorithms: [RSA-2048, RSA-3072, ECDSA-P256]
  default_validity_days: 365
  max_validity_days: 398
  subject:
    common_name: { required: true }
    organization: { required: false }
  san_types: [DNS, IP]
  allow_wildcard: false

enrollment_methods: [rest_api, acme, est]
supported_operations: [issue, renew, revoke]
